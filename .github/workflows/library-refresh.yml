# Rebuilds Tali's library pages from Tali HQ (11 Nov 2026). Run by hand on a branch; it commits the
# refreshed pages to that same branch, so they only go live when the branch is merged.
name: Library refresh
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build_library.py --fetch
      - run: python3 tools/apply_chrome.py
      - run: python3 tools/build_sitemap.py
      - run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -A
          git diff --cached --quiet || git commit -m "Tali's library: every book on the shelf, refreshed from Tali HQ"
          git push
