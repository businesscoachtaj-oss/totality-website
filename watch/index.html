<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Exercise video | Totality</title>
<!--
  Totality exercise video player (Oct 25 2026).
  The apps used to open YouTube exercise links in the YouTube app, which plays its
  full ads. Like Everfit, Totality now plays them with YouTube's embedded player
  (privacy-enhanced youtube-nocookie.com) on this page, opened inside the app.
  YouTube still decides whether a video shows an ad; nothing here blocks ads.
  Opened as /watch?v=<11 character video id>&t=<start seconds, optional>.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100vh; background: #000; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .msg { text-align: center; padding: 24px; color: #cfcfcf; }
  .msg a { color: #F28C28; }
  .done { display: block; text-align: center; color: #9a9a9a; font-size: 13px; padding: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="player" class="frame" hidden></div>
  <p id="bad" class="msg" hidden>This video link doesn't look right. Ask your trainer to check it.</p>
  <span class="done">Close this screen to go back to your workout.</span>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var id = (q.get('v') || '').trim();
  var t = parseInt(q.get('t') || '0', 10);
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) { document.getElementById('bad').hidden = false; return; }
  var src = 'https://www.youtube-nocookie.com/embed/' + id +
    '?autoplay=1&playsinline=1&rel=0&modestbranding=1' + (t > 0 ? '&start=' + t : '');
  var f = document.createElement('iframe');
  f.src = src;
  f.title = 'Exercise video';
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  var box = document.getElementById('player');
  box.appendChild(f);
  box.hidden = false;
})();
</script>
</body>
</html>
